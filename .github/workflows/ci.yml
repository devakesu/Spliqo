name: Spliqo CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-db:
    name: Backend & Database Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.1.0.147
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check app/ tests/

      - name: Run Pyright Type Checking
        run: |
          pyright app/

      - name: Run Database Migrations & pgTAP Tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -f supabase/migrations/20261118000001_auth_and_user_profiles.sql
          psql -h localhost -U postgres -d postgres -f supabase/migrations/20261118000002_core_schema.sql
          psql -h localhost -U postgres -d postgres -f supabase/migrations/20261118000003_functions_triggers_and_rls.sql
          psql -h localhost -U postgres -d postgres -f supabase/tests/00001_core_test.sql

      - name: Run Pytest Suite with Coverage
        env:
          DEBUG: "false"
          SUPABASE_DB_HOST: "localhost"
          SUPABASE_DB_PORT: "5432"
          SUPABASE_DB_USER: "postgres"
          SUPABASE_DB_PASSWORD: "postgres"
          SUPABASE_DB_NAME: "postgres"
        run: |
          pytest tests/ --cov=app --cov-fail-under=80

      - name: Verify OpenAPI Specification Parity
        run: |
          python -c '
          import json, sys
          from app.main import app

          generated = app.openapi()
          with open("openapi.json", "r") as f:
              existing = json.load(f)

          if generated != existing:
              print("ERROR: OpenAPI schema drift detected between app and openapi.json!", file=sys.stderr)
              sys.exit(1)
          print("OpenAPI spec is 100% in sync.")
          '

  flutter-client:
    name: Flutter Client Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spliqo_client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Dart Static Analysis
        run: dart analyze --fatal-infos

      - name: Run Flutter Tests
        run: flutter test
